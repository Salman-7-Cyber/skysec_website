  <section id="phishing-ml-project">
  <h2 class="section-title reveal">Phishing Email Detection ML</h2>
  <h2 class="subtitle">Paste Email Content</h2>

  <textarea id="emailText" rows="10" cols="80"
    placeholder="Paste the email here..."></textarea>

  <br><br>

  <button onclick="analyzeEmail()">Analyze</button>


<script src="script.js"></script>

<div id="resultCard" class="result-card hidden reveal">

  <h2 id="riskTitle"></h2>

  <p class="score">
    Risk Score: <span id="riskScore"></span>
  </p>

  <p class="type">
    Phishing Type: <span id="phishingType"></span>
  </p>

  <div class="info-card">
    <h3>Why was this email flagged?</h3>
    <ul id="reasonsList"></ul>
  </div>

  <div class="info-card warning">
    <h3>Recommended Action</h3>
    <p id="recommendationText"></p>
  </div>
